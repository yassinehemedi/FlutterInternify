name: internify
description: A beautiful user registration and login app with SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite database
  sqflite: ^2.3.0
  path: ^1.8.3

  # UI Components
  cupertino_icons: ^1.0.2

  shared_preferences: ^2.2.1

  http: ^1.1.0  # or latest version
  mailer: ^6.0.1  # or latest version
  crypto: ^3.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0


flutter:
  uses-material-design: true