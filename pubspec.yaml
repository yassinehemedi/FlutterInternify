name: internify
description: A beautiful user registration and login app with SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite database
  sqflite: ^2.3.0
  path: ^1.8.3
  pdf: ^3.11.0
  printing: ^5.13.0
  syncfusion_flutter_pdf: ^24.2.9  # ✅ For reading/editing PDFs with watermarks
  file_picker: ^8.0.0+1  # ✅ Updated version for file picking
  fl_chart: ^0.66.0  # ✅ NEW - For pie charts
  path_provider: ^2.1.2
  signature: ^5.4.0



  # UI Components
  cupertino_icons: ^1.0.2

  shared_preferences: ^2.2.1

  http: ^1.1.0  # or latest version
  mailer: ^6.0.1  # or latest version
  crypto: ^3.0.2
  permission_handler: ^11.0.0  # Add this
  share_plus: ^12.0.0
  bcrypt: ^1.1.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0


flutter:
  uses-material-design: true