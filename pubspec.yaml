name: internify
description: A beautiful user registration and login app with SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite database
  sqflite: ^2.3.0
  path: ^1.8.3
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.2

  # UI Components
  cupertino_icons: ^1.0.2

  shared_preferences: ^2.2.1

  http: ^1.1.0  # or latest version
  mailer: ^6.0.1  # or latest version
  crypto: ^3.0.2
  permission_handler: ^11.0.0  # Add this
  share_plus: ^12.0.0
  url_launcher: ^6.1.7
  flutter_local_notifications: ^19.5.0
  bcrypt: ^1.1.3
  file_picker: ^10.3.3
  open_file: ^3.2.1
  firebase_core: ^2.10.0
  firebase_messaging: ^14.6.0
  pdfx: ^2.9.2
  google_mlkit_text_recognition: ^0.8.0
   # pdf_text removed (no matching published version). Use a server-side converter or add a supported package later.


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0


flutter:
  uses-material-design: true